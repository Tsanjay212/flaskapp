version: "3.8"

services:
  flaskapp:
    build: .
    container_name: flaskapp
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: flask-mariadb-db.cnwcmsquw4d7.ap-south-2.rds.amazonaws.com
      MYSQL_USER: flaskdb
      MYSQL_PASSWORD: Tsanjay212
      MYSQL_DB: sanreach

      REDIS_HOST: 172.31.0.187
      REDIS_PORT: 6379
      REDIS_PASSWORD: Tsanjay212

      # 🔥 IMPORTANT: stable session key
      FLASK_SECRET_KEY: "supersecretkey"

    volumes:
      - ./logs:/opt/flaskapp/logs  # Mount logs directory from the host to the container
      - .:/app  # Mount the current directory to /app in the container, useful for development

    logging:
      driver: "json-file"  # Docker's default logging driver (can be changed based on your preference)
      options:
        max-size: "10m"  # Max size of log file before it's rotated (optional)
        max-file: "3"    # Number of log files to keep (optional)

    restart: always